# Netlify deployment for the Khawaja Woollen Mills dashboard.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# The market-data function serves itself at /api/markets via its in-code
# `config.path`, so only the SPA fallback is needed here.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
