# Netlify deployment for the Khawaja Woolen Mills dashboard.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Expose the crude-oil proxy function at a clean /api/crude path.
[[redirects]]
  from = "/api/crude"
  to = "/.netlify/functions/crude"
  status = 200

# SPA fallback so client routes resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
