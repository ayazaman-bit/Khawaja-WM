# Netlify deployment for the Khawaja Woolen Mills dashboard.

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Expose the market-data proxy (gold + crude) at a clean /api/markets path.
[[redirects]]
  from = "/api/markets"
  to = "/.netlify/functions/markets"
  status = 200

# SPA fallback so client routes resolve to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
